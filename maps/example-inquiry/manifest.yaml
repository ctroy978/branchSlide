graph:
  slug: example-inquiry
  title: "The Trolley and the Gardener"
  description: "A short ethical branching inquiry for classroom demonstration."
  entry_node: start

nodes:
  - slug: start
    title: "The Dilemma"
    type: content
    content: nodes/start.md
    branch_question: nodes/start-question.md

  - slug: virtue-path
    title: "Virtue Ethics"
    type: content
    content: nodes/virtue-path.md

  - slug: consequence-path
    title: "Consequentialism"
    type: content
    content: nodes/consequence-path.md

  - slug: crossroads
    title: "Where the Paths Meet"
    type: content
    content: nodes/crossroads.md
    branch_question: nodes/crossroads-question.md

  - slug: revisit
    title: "Step Back"
    type: content
    content: nodes/revisit.md

  - slug: reflection
    title: "Deeper Reflection"
    type: content
    content: nodes/reflection.md

  - slug: synthesis
    title: "Synthesis"
    type: synthesis
    content: nodes/synthesis.md

branches:
  - from: start
    to: virtue-path
    label: "Explore virtue ethics"
    student_label: "Follow the virtue ethics path — what would a person of practical wisdom do?"
  - from: start
    to: consequence-path
    label: "Explore consequentialism"
    student_label: "Follow the consequentialist path — what outcome produces the greatest good?"

  - from: virtue-path
    to: crossroads
    label: "Continue"
  - from: consequence-path
    to: crossroads
    label: "Continue"

  - from: crossroads
    to: revisit
    label: "Revisit the opening question"
    student_label: "Step back and re-examine the opening dilemma with fresh eyes"
  - from: crossroads
    to: reflection
    label: "Continue to reflection"
    student_label: "Press deeper — what has this inquiry revealed about our moral instincts?"
  - from: crossroads
    to: synthesis
    label: "Jump to synthesis"
    student_label: "Move to conclusions — draw together what we have learned"

  - from: revisit
    to: start
    label: "Return to the dilemma"

  - from: reflection
    to: synthesis
    label: "Conclude"

assets:
  - node: start
    type: image
    path: assets/trolley-diagram.svg
    alt: "Diagram of the trolley problem with five people on the main track and one gardener on the side track"
  - node: start
    type: audio
    path: assets/dilemma-tone.wav
    alt: "Opening tone"
  - node: start
    type: video
    path: assets/dilemma-intro.mp4
    captions: assets/dilemma-intro.vtt
    alt: "Opening segment with captions"