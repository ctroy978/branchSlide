[project]
name = "branchslide"
version = "0.1.0"
description = "Teacher-controlled branching inquiry framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "markdown>=3.7",
    "python-multipart>=0.0.12",
]

[project.scripts]
main = "app.cli:main"
dev = "app.cli:dev"
stop = "app.cli:stop"
publish = "app.cli:publish"
remove = "app.cli:remove"
validate = "app.cli:validate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]