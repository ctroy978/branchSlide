<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BranchSlide{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .prose h1 { @apply text-3xl font-bold mb-4; }
        .prose h2 { @apply text-2xl font-semibold mb-3 mt-6; }
        .prose p { @apply mb-4 leading-relaxed; }
        .prose ul { @apply list-disc pl-6 mb-4; }
        .prose ol { @apply list-decimal pl-6 mb-4; }
        .prose blockquote { @apply border-l-4 border-slate-400 pl-4 italic my-4; }
        .prose pre { @apply bg-slate-900 text-slate-100 p-4 rounded-lg overflow-x-auto my-4; }
        .prose code { @apply bg-slate-100 px-1 rounded text-sm; }
        .prose pre code { @apply bg-transparent p-0; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-slate-50 text-slate-900 min-h-screen{% endblock %}">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
