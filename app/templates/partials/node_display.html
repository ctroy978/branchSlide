<div id="node-display">
    <div class="flex items-center gap-2 mb-3">
        <p class="text-sm uppercase tracking-wide text-slate-500">{{ state.node.node_type }}</p>
        {% if state.display_phase == 'branch_question' %}
        <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium">Branch question — students see this</span>
        {% else %}
        <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">Main slide</span>
        {% endif %}
    </div>
    <h2 class="text-2xl font-bold mb-4">{{ state.node.title }}</h2>
    <div class="prose max-w-none">{{ state.node.html_content | safe }}</div>
</div>
