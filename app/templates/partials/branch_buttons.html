<div id="branch-buttons" class="space-y-3">
    {% if state.branches %}
        {% for branch in state.branches %}
        <button
            onclick="selectBranch({{ branch.id }})"
            class="w-full text-left bg-white border-2 border-indigo-200 hover:border-indigo-500 hover:bg-indigo-50 rounded-xl px-5 py-4 transition">
            <span class="font-medium text-indigo-900">{{ branch.label }}</span>
            <span class="block text-sm text-slate-500 mt-1">→ {{ branch.to_slug }}</span>
        </button>
        {% endfor %}
    {% else %}
        <p class="text-slate-500 italic">No further branches — end of path.</p>
    {% endif %}
</div>
